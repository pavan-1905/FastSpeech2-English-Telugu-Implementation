
dataset: "Telugu"

path:
  corpus_path: "../datasets/Telugu"
  lexicon_path: ""
  raw_path: "./raw_data/Telugu"
  preprocessed_path: "./preprocessed_data/Telugu"

preprocessing:
  val_size: 185

  text:
    text_cleaners: ["telugu_cleaners"]
    language: "te"

  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0

  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024

  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000

  pitch:
    feature: "phoneme_level"
    normalization: True

  energy:
    feature: "phoneme_level"
    normalization: True
